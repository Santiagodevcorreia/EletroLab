/* ============================================================
   ESTADO
   ============================================================ */
const estado = { dados:null, secao:null, grandeza:null, circuito:null };
const dom = {};

/* Valores partilhados entre cartões (sugestões cruzadas) */
const valoresGlobais = {}; // { U: {valor, unidade}, ... }

/* Fórmulas das cartas normais */
const CALCULADORAS = {
  'u-r-i': v => v.R * v.I,
  'u-e-q': v => v.E / v.Q,
  'i-u-r': v => v.U / v.R,
  'i-q-t': v => v.Q / v.T,
  'r-u-i': v => v.U / v.I,
  'p-u-i': v => v.U * v.I,
  'p-e-t': v => v.E / v.T
};

const DENOMINADORES = {
  'u-e-q': ['Q'],
  'i-u-r': ['R'],
  'i-q-t': ['T'],
  'r-u-i': ['I'],
  'p-e-t': ['T']
};

const CAMPOS_NEGATIVOS = {
  'u-r-i': ['I'],
  'u-e-q': ['E','Q'],
  'i-u-r': ['U'],
  'i-q-t': ['Q'],
  'r-u-i': ['U','I'],
  'p-u-i': ['U','I'],
  'p-e-t': ['E']
};
const permiteNegativo = (calculoId, campoId) =>
  (CAMPOS_NEGATIVOS[calculoId] || []).includes(campoId);

/* ============================================================
   PARSE DE VALORES COM UNIDADE
   ============================================================ */
const PREFIXOS = {
  'p': 1e-12, 'n': 1e-9, 'u': 1e-6, 'µ': 1e-6, 'μ': 1e-6,
  'm': 1e-3, 'c': 1e-2, 'd': 1e-1,
  'k': 1e3, 'K': 1e3, 'M': 1e6, 'G': 1e9
};
const UNIDADES_VALIDAS = ['V','A','Ω','W','J','C','s'];

function parseValor(str, unidadeEsperada){
  if (typeof str !== 'string') return NaN;
  let s = str.trim().replace(/\s+/g,'').replace(',','.');
  if (!s) return NaN;

  const mNum = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?)/);
  if (!mNum) return NaN;
  const base = parseFloat(mNum[1]);
  if (!isFinite(base)) return NaN;
  s = s.slice(mNum[1].length);

  let prefixo = '', unidade = '';
  if (s === '') return base;
  const sLow = s.toLowerCase();
  if (sLow === 'ohm' || sLow === 'ohms'){
    unidade = 'Ω';
  } else if (s.endsWith('Ω')){
    unidade = 'Ω';
    prefixo = s.slice(0, -1);
  } else if (UNIDADES_VALIDAS.includes(s[s.length-1])){
    unidade = s[s.length-1];
    prefixo = s.slice(0, -1);
  } else {
    prefixo = s;
  }

  if (prefixo && !(prefixo in PREFIXOS)) return NaN;
  if (unidade && unidadeEsperada && unidade !== unidadeEsperada) return NaN;

  const mult = prefixo ? PREFIXOS[prefixo] : 1;
  return base * mult;
}

/* ============================================================
   AVISOS DE CAMPO
   ============================================================ */
function avisoCampo(campo, texto){
  const av = campo && campo.querySelector('.campo-aviso');
  if (!av) return;
  av.textContent = texto;
  av.hidden = false;
  clearTimeout(av._t);
  av._t = setTimeout(() => { av.hidden = true; }, 3500);
}
function esconderAvisoCampo(campo){
  const av = campo && campo.querySelector('.campo-aviso');
  if (!av) return;
  clearTimeout(av._t);
  av.hidden = true;
}

/* ============================================================
   SUGESTÕES CRUZADAS
   ============================================================ */
function atualizarValorGlobal(simbolo, valor, unidade){
  valoresGlobais[simbolo] = { valor, unidade };
  atualizarSugestoes();
}
function atualizarSugestoes(){
  document.querySelectorAll('.campo').forEach(campo => {
    const inp = campo.querySelector('input[type="text"]');
    const sug = campo.querySelector('.sugestao');
    if (!inp || !sug) return;
    const nome = inp.name;
    const gv = valoresGlobais[nome];
    if (gv && inp.value.trim() === ''){
      sug.hidden = false;
      sug.innerHTML = `usar <b>${fmtNum(gv.valor)} ${gv.unidade}</b>`;
      sug.dataset.valor = String(gv.valor);
    } else {
      sug.hidden = true;
    }
  });
}

   ============================================================ */
const CHAVE_TEMA = 'calculadora-tema';
function obterTemaInicial(){
  try { const g = localStorage.getItem(CHAVE_TEMA); if (g) return g; } catch(_){}
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
}
function aplicarTema(tema){
  document.body.classList.toggle('tema-claro', tema === 'claro');
  try { localStorage.setItem(CHAVE_TEMA, tema); } catch(_){}
  const b = document.getElementById('btnTema');
  if (b) {
    const r = b.querySelector('.rotulo');
    if (r) r.textContent = tema === 'claro' ? 'Tema escuro' : 'Tema claro';
  }
}
function alternarTema(){
  aplicarTema(document.body.classList.contains('tema-claro') ? 'escuro' : 'claro');
}

/* ============================================================
   ARRANQUE
   ============================================================ */
document.addEventListener('DOMContentLoaded', iniciar);

async function iniciar(){
  aplicarTema(obterTemaInicial());

  dom.subnav        = document.getElementById('subnav');
  dom.submenuTitulo = document.getElementById('submenuTitulo');
  dom.submenuLista  = document.getElementById('submenuLista');
  dom.conteudo      = document.getElementById('conteudo');

  document.getElementById('btnTema').addEventListener('click', alternarTema);

  document.querySelectorAll('.menu-item').forEach(b => {
    b.addEventListener('click', () => abrirSecao(b.dataset.secao));
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape') desativarSimboloAtivo(); });
  document.addEventListener('keydown', atalhosCircuito);

  // Ajusta o histórico quando a janela é redimensionada
  window.addEventListener('resize', debounce(() => {
    document.querySelectorAll('.historico-lista').forEach(ajustarAlturaHistorico);
  }, 150));

  try {
    const resp = await fetch('Calculadora.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    estado.dados = await resp.json();
  } catch (err) {
    console.error('Não foi possível carregar Calculadora.json:', err);
    dom.conteudo.innerHTML = `
      <div class="cabecalho-secao">
        <h2>Erro ao carregar dados</h2>
        <p>Não foi possível ler o ficheiro <code>Calculadora.json</code>.
        Confirma que está na mesma pasta que este HTML e recarrega a página.</p>
      </div>`;
    return;
  }
  // garante a aba "Circuitos montados" mesmo com um Calculadora.json antigo
  if (!estado.dados.circuitos.some(c => c.id === 'prontos')){
    estado.dados.circuitos.push({ id:'prontos', nome:'Circuitos montados',
      explicacao:'Circuitos já montados e a funcionar, para ver, testar e alterar.' });
  }
  abrirSecao('inicio');
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function abrirSecao(secao){
  estado.secao = secao;
  document.querySelectorAll('.menu-item').forEach(b => b.classList.toggle('ativo', b.dataset.secao === secao));

  const semSub = secao === 'inicio';
  dom.subnav.classList.toggle('oculto', semSub);

  if (secao === 'calcular' && !estado.grandeza) estado.grandeza = estado.dados.grandezas[0].id;
  if (secao === 'circuitos' && !estado.circuito) estado.circuito = estado.dados.circuitos[0].id;

  renderSubmenu();
  renderConteudo();
}

/* ============================================================
   SUBMENU
   ============================================================ */
function renderSubmenu(){
  dom.submenuLista.innerHTML = '';
  if (estado.secao === 'inicio') { dom.submenuTitulo.textContent = ''; return; }
  if (estado.secao === 'calcular') {
    dom.submenuTitulo.textContent = 'Grandezas';
    estado.dados.grandezas.forEach(g => {
      const b = document.createElement('button');
      b.className = 'submenu-item' + (estado.grandeza === g.id ? ' ativo' : '');
      b.innerHTML = `<span class="submenu-simbolo">${g.simbolo}</span><span>${g.nome}</span>`;
      b.addEventListener('click', () => { estado.grandeza = g.id; renderSubmenu(); renderConteudo(); });
      dom.submenuLista.appendChild(b);
    });
  } else if (estado.secao === 'circuitos') {
    dom.submenuTitulo.textContent = 'Circuitos';
    estado.dados.circuitos.forEach(c => {
      const b = document.createElement('button');
      b.className = 'submenu-item' + (estado.circuito === c.id ? ' ativo' : '');
      b.innerHTML = `<span>${c.nome}</span>`;
      b.addEventListener('click', () => { estado.circuito = c.id; renderSubmenu(); renderConteudo(); });
      dom.submenuLista.appendChild(b);
    });
  } else if (estado.secao === 'autores') {
    dom.submenuTitulo.textContent = 'Autores';
    const b = document.createElement('button');
    b.className = 'submenu-item ativo';
    b.innerHTML = `<span>Equipa do projeto</span>`;
    dom.submenuLista.appendChild(b);
  }
}

/* ============================================================
   CONTEÚDO
   ============================================================ */
function renderConteudo(){
  if (estado.secao === 'inicio') renderInicio();
  else if (estado.secao === 'calcular') renderCalcular();
  else if (estado.secao === 'circuitos') renderCircuitos(estado.circuito === 'prontos');
  else if (estado.secao === 'autores') renderAutores();
  setTimeout(atualizarSugestoes, 0);
}

  if (!g) return;
  dom.conteudo.innerHTML = `
    <div class="cabecalho-secao">
      <h2>${g.nome} <span class="simbolo">(${g.simbolo})</span></h2>
      <p>${g.descricao}</p>
    </div>
    <div class="calcular-layout">
      <div class="grelha-cartoes"></div>
      <aside class="calculo-notas" aria-label="Dicas de utilização">
        <div><span>01</span><p><strong>Unidades reconhecidas</strong>Escreve, por exemplo, 12 V, 500 mA ou 2 kΩ.</p></div>
        <div><span>02</span><p><strong>Vírgula ou expoente</strong>Aceita 1,5 e também notação científica, como 1,5e3.</p></div>
        <div><span>03</span><p><strong>Reutiliza resultados</strong>Os valores calculados podem preencher outros campos automaticamente.</p></div>

    </div>`;
  const grelha = dom.conteudo.querySelector('.grelha-cartoes');

function criarCartao(calculo, grandeza){
  const c = document.createElement('div');
  c.className = 'cartao';
  c.innerHTML = `
    <div class="formula-chip">${eqHTML(calculo.formula)}</div>
    <p class="explicacao">${calculo.explicacao}</p>
    <form class="form-calculo">
      ${calculo.campos.map(cp => {
        const neg = permiteNegativo(calculo.id, cp.id);
        const mUn = cp.label.match(/\(([^)]+)\)\s*$/);
        const unidade = mUn ? mUn[1] : '';
        return `
        <div class="campo">
          <label for="in_${calculo.id}_${cp.id}">${cp.label}</label>
          <div class="campo-num">
            <input id="in_${calculo.id}_${cp.id}" name="${cp.id}" type="text"
                   inputmode="decimal" placeholder="—" autocomplete="off" spellcheck="false"
                   data-neg="${neg ? 1 : 0}" data-unidade="${unidade}"
                   title="${neg ? 'Aceita valores negativos' : 'Não aceita valores negativos'} · Podes indicar a unidade (ex.: 12 ${unidade}, 500 m${unidade})">
            <div class="stepper">
              <button type="button" tabindex="-1" data-d="1" aria-label="Aumentar"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5 6 4l3.5 3.5"/></svg></button>
              <button type="button" tabindex="-1" data-d="-1" aria-label="Diminuir"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button>
            </div>
          </div>
          <p class="campo-aviso" hidden></p>
          <button type="button" class="sugestao" hidden></button>
        </div>`;
      }).join('')}
      <button type="submit" class="btn-calcular">Calcular</button>
      <div class="resultado"></div>
    </form>
    <div class="historico">
      <div class="historico-cab"><h4>Histórico</h4><button type="button" class="btn-hist-limpar" hidden>Limpar</button></div>
      <ul class="historico-lista"></ul>
    </div>`;

  const form = c.querySelector('form');

  form.querySelectorAll('.stepper button').forEach(b => b.addEventListener('click', ev => {
    const campo = b.closest('.campo');
    const inp = campo.querySelector('input');
    const unidade = inp.dataset.unidade || '';
    const passo = (ev.shiftKey ? .1 : 1) * Number(b.dataset.d);
    const atual = parseValor(inp.value, unidade);
    const base = isFinite(atual) ? atual : 0;
    let novo = Math.round((base + passo) * 1e6) / 1e6;
    if (novo < 0 && inp.dataset.neg !== '1'){
      novo = 0;
      avisoCampo(campo, 'Este valor não pode ser negativo — o mínimo é 0.');
    } else {
      esconderAvisoCampo(campo);
    }
    inp.value = String(novo);
    inp.classList.remove('invalido');
    atualizarSugestoes();
  }));

  form.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => {
    inp.classList.remove('invalido');
    esconderAvisoCampo(inp.closest('.campo'));
    atualizarSugestoes();
  }));

  form.querySelectorAll('.sugestao').forEach(s => s.addEventListener('click', () => {
    const campo = s.closest('.campo');
    const inp = campo.querySelector('input');
    inp.value = s.dataset.valor;
    inp.classList.remove('invalido');
    esconderAvisoCampo(campo);
    atualizarSugestoes();
    inp.focus();
  }));

  const resultado = c.querySelector('.resultado');

  form.addEventListener('submit', e => {
    e.preventDefault();
    resultado.className = 'resultado';
    form.querySelectorAll('input').forEach(i => i.classList.remove('invalido'));

    const valores = {};
    let erro = null;

    for (const cp of calculo.campos) {
      const inp = form.querySelector(`[name="${cp.id}"]`);
      const v = inp.value.trim();
      if (v === ''){ inp.classList.add('invalido'); erro = erro || 'Preenche todos os campos.'; continue; }
      const unidade = inp.dataset.unidade || '';
      const n = parseValor(v, unidade);
      if (!isFinite(n)){
        inp.classList.add('invalido');
        avisoCampo(inp.closest('.campo'), `Valor inválido. Usa um número (ex.: 12, 12,5, 1,5e3) com unidade opcional (ex.: 12 ${unidade}, 500 m${unidade}).`);
        erro = erro || `Valor inválido em "${cp.label}".`;
        continue;
      }
      if (n < 0 && !permiteNegativo(calculo.id, cp.id)){
        inp.classList.add('invalido');
        avisoCampo(inp.closest('.campo'), 'Este valor não pode ser negativo — o mínimo é 0.');
        erro = erro || `"${cp.label}" não pode ser negativo.`;
        continue;
      }
      valores[cp.id] = n;
    }
    if (erro){ resultado.classList.add('visivel','erro'); resultado.textContent = erro; return; }

    for (const nome of (DENOMINADORES[calculo.id] || [])) {
      if (valores[nome] === 0){
        form.querySelector(`[name="${nome}"]`).classList.add('invalido');
        resultado.classList.add('visivel','erro');
        resultado.textContent = 'Não é possível dividir por zero.';
        return;
      }
    }

    const fn = CALCULADORAS[calculo.id];
    if (!fn){ resultado.classList.add('visivel','erro'); resultado.textContent = 'Cálculo não implementado.'; return; }

    const valor = fn(valores);

    if (Number.isNaN(valor)){
      resultado.classList.add('visivel','erro');
      resultado.textContent = 'Resultado inválido.';
      return;
    }
    if (!isFinite(valor)){ resultado.classList.add('visivel','erro'); resultado.textContent = 'Resultado inválido.'; return; }

    if (grandeza.id === 'resistencia' && valor < 0){
      resultado.classList.add('visivel','erro');
      resultado.textContent = 'A resistência não pode ser negativa. Verifica os sinais da tensão e da corrente.';
      return;
    }

    resultado.classList.add('visivel');
    resultado.innerHTML = eqHTML(calculo.formula, valores, valor, grandeza.unidade);

    atualizarValorGlobal(grandeza.simbolo, valor, grandeza.unidade);

    gravarHistorico(calculo.id, [{ v:valores, r:valor }, ...lerHistorico(calculo.id)].slice(0, 10));
    renderHistorico(c, calculo, grandeza);
  });

  c.querySelector('.btn-hist-limpar').addEventListener('click', () => { gravarHistorico(calculo.id, []); renderHistorico(c, calculo, grandeza); });
  renderHistorico(c, calculo, grandeza);
  return c;
}

/* ---------- EQUAÇÕES E HISTÓRICO ---------- */
const CHAVE_HIST = 'calculadora-historico-sessao';
const CHAVE_HIST_ANTIGA = 'calculadora-historico';
const memHist = {};
try { localStorage.removeItem(CHAVE_HIST_ANTIGA); } catch(_){}
function lerHistorico(id){
  if (memHist[id]) return memHist[id];
  let l = [];
  try { l = (JSON.parse(sessionStorage.getItem(CHAVE_HIST)) || {})[id] || []; } catch(_){}
  return memHist[id] = l;
}
function gravarHistorico(id, l){
  memHist[id] = l;
  try { const t = JSON.parse(sessionStorage.getItem(CHAVE_HIST)) || {}; t[id] = l; sessionStorage.setItem(CHAVE_HIST, JSON.stringify(t)); } catch(_){}
}
function fmtNum(v){ return Number(v.toFixed(6)).toLocaleString('pt-PT', { maximumFractionDigits:6 }); }

/* ============================================================
   HISTÓRICO — ALTURA DINÂMICA (4 linhas / 3 frações) COM SCROLL
   ============================================================ */
function debounce(fn, ms){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

/**
 * Calcula a altura máxima do contentor do histórico de forma a mostrar
 * exatamente 4 resultados em equações lineares e 3 em equações com fração.
 * Aplica overflow-y:auto para permitir scroll nos restantes.
 */
function ajustarAlturaHistorico(listaEl){
  if (!listaEl) return;
  requestAnimationFrame(() => {
    if (!listaEl.isConnected) return;

    const itens = listaEl.querySelectorAll('.hist-item');
    if (!itens.length){
      // Sem itens — remove limite e esconde scroll
      listaEl.style.maxHeight = '';
      listaEl.style.overflowY = 'hidden';
      return;
    }

    // Deteta fração em qualquer item (todas as entradas do mesmo cálculo têm a mesma estrutura)
    const temFracao = !!listaEl.querySelector('.frac');
    const numVisiveis = temFracao ? 3 : 4;

    const primeiro = itens[0];
    const estilo = getComputedStyle(listaEl);
    const gap = parseFloat(estilo.rowGap) || parseFloat(estilo.gap) || 6;
    const alturaItem = primeiro.offsetHeight;

    if (!alturaItem) return; // layout ainda não disponível — aborta medição

    const maxHeight = numVisiveis * alturaItem + (numVisiveis - 1) * gap;
    listaEl.style.maxHeight = maxHeight + 'px';
    listaEl.style.overflowY = 'auto';
  });
}

function renderHistorico(c, calculo, g){
  const lista = lerHistorico(calculo.id);
  const listaEl = c.querySelector('.historico-lista');
  listaEl.innerHTML = lista.length
    ? lista.map(x => `<li class="hist-item">${eqHTML(calculo.formula, x.v, x.r, g.unidade)}</li>`).join('')
    : '<li class="hist-vazio">Ainda não há cálculos nesta sessão. Os resultados aparecem aqui.</li>';
  c.querySelector('.btn-hist-limpar').hidden = !lista.length;

  // Ajusta a altura de acordo com o tipo de equação
  ajustarAlturaHistorico(listaEl);

  // Garante que o resultado mais recente fica visível
  requestAnimationFrame(() => { listaEl.scrollTop = 0; });
}

function dividirTopo(s, sep){
  const out = []; let d = 0, ini = 0;
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (ch === '(') d++; else if (ch === ')') d--;
    else if (d === 0 && ch === sep){ out.push(s.slice(ini, i)); ini = i + 1; }
  }
  out.push(s.slice(ini));
  return out.map(p => p.trim());
}
function eqExpr(s, val){
  const f = dividirTopo(s, '÷');
  if (f.length > 1) return `<span class="frac"><span class="num">${eqProduto(f[0], val)}</span><span class="den">${eqProduto(f[1], val)}</span></span>`;
  return eqProduto(s, val);
}
function eqProduto(s, val){
  return dividirTopo(s, '×').map(t => eqTermo(t, val)).join('<span class="op">×</span>');
}
function eqTermo(t, val){
  const quad = t.endsWith('²');
  const base = quad ? t.slice(0, -1) : t;
  const key = base === 'Δt' ? 'T' : base;
  const txt = val && val[key] !== undefined ? fmtNum(val[key]) : `<i class="v">${base}</i>`;
  return quad ? `<span class="pot">${txt}<sup>2</sup></span>` : `<span>${txt}</span>`;
}
function eqHTML(formula, val, res, un){
  const [lhs, rhs] = formula.split('=').map(s => s.trim());
  let h = `<span class="eq${val ? ' eq-hist' : ''}"><i class="v">${lhs}</i><span class="op">=</span>${eqExpr(rhs, val)}`;
  if (res !== undefined) h += `<span class="op">=</span><b class="res">${fmtNum(res)}&nbsp;${un}</b>`;
  return h + '</span>';
}

    </div>
    ${prontos ? '<div class="prontos-bloco"><div class="prontos-lista" id="prontosLista"></div><p class="prontos-desc" id="prontosDesc"></p></div>' : ''}
    <div class="circuito-editor">

        </div>
        <div class="paleta-scroll" id="paletaScroll"></div>
        <p class="paleta-nota">ESC cancela. O botão direito apaga. R roda o elemento selecionado. Ctrl+C / Ctrl+V copia e cola. As pontas dos fios encaixam automaticamente nos terminais.</p>
      </aside>
      <div class="coluna-desenho">
      <div class="estado-circuito" id="estadoCircuito"></div>
      <div class="grelha-pontos" id="canvas-circuito">
        <p class="dica-canvas">Seleciona um símbolo à esquerda e clica aqui para o colocar. Arrasta para mover; o botão direito apaga.</p>
      </div>
      <div class="inspetor" id="inspetor"></div>
      </div>
    </div>`;

  const paletaScroll = document.getElementById('paletaScroll');
  const canvas = document.getElementById('canvas-circuito');
  const paleta = dom.conteudo.querySelector('.paleta');
  canvasAtual = canvas;
  if (obsCircuito) obsCircuito.disconnect();
  obsCircuito = new MutationObserver(agendarSim);
  obsCircuito.observe(canvas, { childList:true, subtree:true, attributes:true,
    attributeFilter:['style','data-x1','data-y1','data-x2','data-y2','data-valor','data-tipo','data-queimado','data-rot'] });
  selecionar(null);

  CATEGORIAS_SIMBOLOS.forEach(cat => {
    const grupo = document.createElement('details');
    grupo.className = 'paleta-grupo';
    grupo.open = false;
    grupo.innerHTML = `<summary class="paleta-grupo-titulo">${cat.nome}<span class="contagem">${Object.keys(cat.itens).length}</span></summary>`;
    const grelha = document.createElement('div');
    grelha.className = 'paleta-grelha';
    Object.entries(cat.itens).forEach(([id, s]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'paleta-item';
      b.dataset.tipo = id;
      b.title = s.nome;
      b.innerHTML = `<span class="paleta-svg">${s.svg}</span><span class="paleta-nome">${s.nome}</span>`;
      b.addEventListener('click', () => {
        const jaAtivo = b.classList.contains('ativo');
        paleta.querySelectorAll('.paleta-item').forEach(x => x.classList.remove('ativo'));
        canvas.classList.remove('a-colocar');
        if (!jaAtivo) { b.classList.add('ativo'); canvas.classList.add('a-colocar'); }
      });
      grelha.appendChild(b);
    });
    grupo.appendChild(grelha);
    paletaScroll.appendChild(grupo);
  });

  document.getElementById('btnLimpar').addEventListener('click', () => {
    canvas.querySelectorAll('.elemento').forEach(e => e.remove());
    selecionar(null);
    if (!canvas.querySelector('.dica-canvas')) {
      const d = document.createElement('p');
      d.className = 'dica-canvas';
      d.textContent = 'Seleciona um símbolo à esquerda e clica aqui para o colocar.';
      canvas.appendChild(d);
    }
  });

  let premidoEmElemento = false, premidoX = 0, premidoY = 0;
  canvas.addEventListener('pointerdown', e => {
    premidoEmElemento = !!e.target.closest('.elemento');
    premidoX = e.clientX; premidoY = e.clientY;
  }, true);

  canvas.addEventListener('click', e => {
    const veioDeElemento = premidoEmElemento;
    const arrastou = Math.hypot(e.clientX - premidoX, e.clientY - premidoY) > 4;
    premidoEmElemento = false;
    if (veioDeElemento || arrastou || estadoArrastoFio.ativo) return;
    if (e.target.closest('.elemento')) return;
    const ativo = paleta.querySelector('.paleta-item.ativo');
    if (!ativo) { selecionar(null); return; }
    const rect = canvas.getBoundingClientRect();
    colocarElemento(canvas, ativo.dataset.tipo, e.clientX - rect.left, e.clientY - rect.top);
  });

  canvas.addEventListener('contextmenu', e => {
    const el = e.target.closest('.elemento');
    if (el) { e.preventDefault(); removerElemento(el); }
  });

  if (prontos) iniciarProntos(canvas);
}

/* ============================================================
   SNAP — CONEXÃO AUTOMÁTICA DE FIOS
   ============================================================ */
const SNAP_DIST = 20;
const ligacoesFio = new WeakMap();
const estadoArrastoFio = { ativo: false };

function obterLigacao(el, end){
  const m = ligacoesFio.get(el);
  return m ? m[end] : null;
}
function definirLigacao(el, end, alvo){
  let m = ligacoesFio.get(el);
  if (!m){ m = {}; ligacoesFio.set(el, m); }
  const antigo = m[end];
  if (antigo && antigo.tipo === 'fio'){
    const mo = ligacoesFio.get(antigo.el);
    if (mo && mo[antigo.end] && mo[antigo.end].el === el) delete mo[antigo.end];
  }
  m[end] = alvo;
}
function limparLigacao(el, end){
  const m = ligacoesFio.get(el);
  if (!m) return;
  const antigo = m[end];
  if (antigo && antigo.tipo === 'fio'){
    const mo = ligacoesFio.get(antigo.el);
    if (mo && mo[antigo.end] && mo[antigo.end].el === el) delete mo[antigo.end];
  }
  delete m[end];
}
function posicaoTerminal(el, idx){ return terminais(el)[idx]; }
function posicaoPontaFio(el, end){ return [+el.dataset['x' + end], +el.dataset['y' + end]]; }

function encontrarAlvoSnap(fioAtual, end, x, y, canvas){
  let melhor = null, melhorDist = SNAP_DIST;
  const elementos = canvas.querySelectorAll('.elemento');
  for (const el of elementos){
    if (el === fioAtual) continue;
    if (el.dataset.tipo === 'fio'){
      for (const e of ['1', '2']){
        const [px, py] = posicaoPontaFio(el, e);
        const d = Math.hypot(px - x, py - y);
        if (d < melhorDist){ melhorDist = d; melhor = { tipo:'fio', el, end:e }; }
      }
    } else {
      const t = terminais(el);
      for (let i = 0; i < 2; i++){
        const d = Math.hypot(t[i][0] - x, t[i][1] - y);
        if (d < melhorDist){ melhorDist = d; melhor = { tipo:'elemento', el, idx:i }; }
      }
    }
  }
  return melhor;
}
function aplicarSnap(fio, end, alvo){
  let x, y;
  if (alvo.tipo === 'elemento'){ [x, y] = posicaoTerminal(alvo.el, alvo.idx); }
  else { [x, y] = posicaoPontaFio(alvo.el, alvo.end); }
  fio.dataset['x' + end] = x;
  fio.dataset['y' + end] = y;
  definirLigacao(fio, end, alvo);
  atualizarFio(fio);
}
function removerSnap(fio, end){ limparLigacao(fio, end); }

function atualizarLigacoesDe(elMovido){
  const canvas = elMovido.parentElement;
  if (!canvas) return;
  const fios = canvas.querySelectorAll('.elemento-fio');
  for (const fio of fios){
    const m = ligacoesFio.get(fio);
    if (!m) continue;
    for (const end of ['1','2']){
      const lig = m[end];
      if (!lig) continue;
      if (lig.el === elMovido){
        let x, y;
        if (lig.tipo === 'elemento'){ [x, y] = posicaoTerminal(lig.el, lig.idx); }
        else { [x, y] = posicaoPontaFio(lig.el, lig.end); }
        fio.dataset['x' + end] = x;
        fio.dataset['y' + end] = y;
        atualizarFio(fio);
      }
    }
  }
}

function removerElemento(el){
  const canvas = el.parentElement;
  if (!canvas) return;
  const fios = canvas.querySelectorAll('.elemento-fio');
  for (const fio of fios){
    if (fio === el){ ligacoesFio.delete(fio); continue; }
    const m = ligacoesFio.get(fio);
    if (!m) continue;
    for (const end of ['1','2']){
      const lig = m[end];
      if (lig && lig.el === el) limparLigacao(fio, end);
    }
  }
  el.remove();
  selecionar(null);
}

let alvoDestacado = null;
function destacarAlvo(alvo){
  if (alvoDestacado === alvo) return;
  if (alvoDestacado){
    if (alvoDestacado.tipo === 'elemento'){
      const t = alvoDestacado.el.querySelectorAll('.terminal');
      if (t[alvoDestacado.idx]) t[alvoDestacado.idx].classList.remove('snap-alvo');
    } else {
      const svg = alvoDestacado.el.querySelector('.fio-svg');
      if (svg){
        const h = svg.querySelector(`.fio-handle[data-end="${alvoDestacado.end}"]`);
        if (h) h.classList.remove('snap-preview');
      }
    }
  }
  alvoDestacado = alvo;
  if (alvo){
    if (alvo.tipo === 'elemento'){
      const t = alvo.el.querySelectorAll('.terminal');
      if (t[alvo.idx]) t[alvo.idx].classList.add('snap-alvo');
    } else {
      const svg = alvo.el.querySelector('.fio-svg');
      if (svg){
        const h = svg.querySelector(`.fio-handle[data-end="${alvo.end}"]`);
        if (h) h.classList.add('snap-preview');
      }
    }
  }
}

function colocarElemento(canvas, tipo, x, y){
  const dica = canvas.querySelector('.dica-canvas');
  if (dica) dica.remove();
  if (tipo === 'fio') criarFio(canvas, x, y);
  else criarElementoNormal(canvas, tipo, x, y);
}

function criarElementoNormal(canvas, tipo, x, y){
  const el = document.createElement('div');
  el.className = 'elemento';
  el.dataset.tipo = tipo;
  el.style.left = (x - 40) + 'px';
  el.style.top  = (y - 30) + 'px';
  montarElemento(el);
  el.addEventListener('pointerdown', iniciarArrasto);
  el.addEventListener('dblclick', () => alternarInterruptor(el));
  canvas.appendChild(el);
  selecionar(el);
  autoSnapFiosProximos(canvas, el);
  return el;
}

function autoSnapFiosProximos(canvas, novoEl){
  const term = terminais(novoEl);
  const fios = canvas.querySelectorAll('.elemento-fio');
  for (const fio of fios){
    for (const end of ['1','2']){
      if (obterLigacao(fio, end)) continue;
      const [fx, fy] = posicaoPontaFio(fio, end);
      for (let i = 0; i < 2; i++){
        const d = Math.hypot(fx - term[i][0], fy - term[i][1]);
        if (d <= SNAP_DIST){
          aplicarSnap(fio, end, { tipo:'elemento', el:novoEl, idx:i });
          break;
        }
      }
    }
  }
}

function criarFio(canvas, x, y){
  const el = document.createElement('div');
  el.className = 'elemento elemento-fio';
  el.dataset.tipo = 'fio';
  el.dataset.x1 = x - 70;
  el.dataset.y1 = y;
  el.dataset.x2 = x + 70;
  el.dataset.y2 = y;
  el.innerHTML = `
    <svg class="fio-svg" xmlns="http://www.w3.org/2000/svg">
      <path class="fio-hit" fill="none" stroke="transparent" stroke-width="20" stroke-linecap="round"/>
      <path class="fio-linha" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path class="fio-fluxo" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 13"/>
      <circle class="fio-handle" data-end="1" r="7" fill="currentColor"/>
      <circle class="fio-handle" data-end="2" r="7" fill="currentColor"/>
      <circle class="fio-handle fio-handle-curva" data-end="m" r="6" fill="currentColor"/>
    </svg>`;
  atualizarFio(el);
  el.addEventListener('pointerdown', iniciarArrastoFio);
  el.addEventListener('dblclick', ev => {
    if (ev.target.closest('.fio-handle-curva')) { delete el.dataset.cx; delete el.dataset.cy; atualizarFio(el); }
  });
  canvas.appendChild(el);
  autoSnapFio(el, canvas);
  return el;
}

function autoSnapFio(fio, canvas){
  const elementos = canvas.querySelectorAll('.elemento');
  for (const end of ['1','2']){
    const [fx, fy] = posicaoPontaFio(fio, end);
    let melhor = null, melhorDist = SNAP_DIST;
    for (const el of elementos){
      if (el === fio) continue;
      if (el.dataset.tipo === 'fio'){
        for (const e of ['1','2']){
          const [px, py] = posicaoPontaFio(el, e);
          const d = Math.hypot(px - fx, py - fy);
          if (d < melhorDist){ melhorDist = d; melhor = { tipo:'fio', el, end:e }; }
        }
      } else {
        const t = terminais(el);
        for (let i = 0; i < 2; i++){
          const d = Math.hypot(t[i][0] - fx, t[i][1] - fy);
          if (d < melhorDist){ melhorDist = d; melhor = { tipo:'elemento', el, idx:i }; }
        }
      }
    }
    if (melhor) aplicarSnap(fio, end, melhor);
  }
}

function ctrlFio(el){
  return el.dataset.cx !== undefined
    ? [+el.dataset.cx, +el.dataset.cy]
    : [(+el.dataset.x1 + +el.dataset.x2) / 2, (+el.dataset.y1 + +el.dataset.y2) / 2];
}

function atualizarFio(el){
  const x1 = +el.dataset.x1, y1 = +el.dataset.y1, x2 = +el.dataset.x2, y2 = +el.dataset.y2;
  const [cx, cy] = ctrlFio(el);
  const PAD = 15;
  const minX = Math.min(x1, x2, cx), minY = Math.min(y1, y2, cy);
  const totalW = Math.max(Math.max(x1, x2, cx) - minX + PAD * 2, 40);
  const totalH = Math.max(Math.max(y1, y2, cy) - minY + PAD * 2, 40);
  el.style.left = (minX - PAD) + 'px';
  el.style.top  = (minY - PAD) + 'px';
  el.style.width  = totalW + 'px';
  el.style.height = totalH + 'px';

  const lx = x => x - minX + PAD, ly = y => y - minY + PAD;
  const svg = el.querySelector('.fio-svg');
  svg.setAttribute('width', totalW); svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
  const d = `M ${lx(x1)} ${ly(y1)} Q ${lx(cx)} ${ly(cy)} ${lx(x2)} ${ly(y2)}`;
  ['.fio-hit', '.fio-linha', '.fio-fluxo'].forEach(s => svg.querySelector(s).setAttribute('d', d));

  const pos = (sel, x, y) => { const n = svg.querySelector(sel); n.setAttribute('cx', lx(x)); n.setAttribute('cy', ly(y)); };
  pos('.fio-handle[data-end="1"]', x1, y1);
  pos('.fio-handle[data-end="2"]', x2, y2);
  pos('.fio-handle[data-end="m"]', .25 * x1 + .5 * cx + .25 * x2, .25 * y1 + .5 * cy + .25 * y2);
}

function iniciarArrastoFio(e){
  if (e.button !== 0) return;
  const el = e.currentTarget;
  const canvas = el.parentElement;
  if (!canvas) return;
  e.preventDefault(); e.stopPropagation();

  const handle = e.target.closest('.fio-handle');
  const modo = handle ? (handle.dataset.end === 'm' ? 'curva' : 'ponta-' + handle.dataset.end) : 'corpo';
  const sx = e.clientX, sy = e.clientY;
  const x1 = +el.dataset.x1, y1 = +el.dataset.y1;
  const x2 = +el.dataset.x2, y2 = +el.dataset.y2;
  const curvo = el.dataset.cx !== undefined;
  const [cx0, cy0] = ctrlFio(el);
  const rc = canvas.getBoundingClientRect();
  let moveu = false;

  const endArrastado = modo.startsWith('ponta-') ? modo.split('-')[1] : null;
  if (endArrastado){ removerSnap(el, endArrastado); }

  el.classList.add('a-arrastar');
  estadoArrastoFio.ativo = true;

  function mover(ev){
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.hypot(dx, dy) > 4) moveu = true;

    if (modo === 'ponta-1' || modo === 'ponta-2'){
      const end = modo.split('-')[1];
      let nx = (end === '1' ? x1 : x2) + dx;
      let ny = (end === '1' ? y1 : y2) + dy;
      const alvo = encontrarAlvoSnap(el, end, nx, ny, canvas);
      if (alvo){
        if (alvo.tipo === 'elemento'){ [nx, ny] = posicaoTerminal(alvo.el, alvo.idx); }
        else { [nx, ny] = posicaoPontaFio(alvo.el, alvo.end); }
        el.classList.add('snap-ativo');
        destacarAlvo(alvo);
      } else {
        el.classList.remove('snap-ativo');
        destacarAlvo(null);
      }
      if (end === '1'){ el.dataset.x1 = nx; el.dataset.y1 = ny; }
      else { el.dataset.x2 = nx; el.dataset.y2 = ny; }
    }
    else if (modo === 'curva'){
      const mx = ev.clientX - rc.left, my = ev.clientY - rc.top;
      el.dataset.cx = 2 * mx - (x1 + x2) / 2;
      el.dataset.cy = 2 * my - (y1 + y2) / 2;
    }
    else {
      el.dataset.x1 = x1 + dx; el.dataset.y1 = y1 + dy;
      el.dataset.x2 = x2 + dx; el.dataset.y2 = y2 + dy;
      if (curvo){ el.dataset.cx = cx0 + dx; el.dataset.cy = cy0 + dy; }
    }
    atualizarFio(el);
  }

  function parar(){
    if (!moveu) selecionar(el);
    el.classList.remove('a-arrastar');
    el.classList.remove('snap-ativo');
    destacarAlvo(null);
    estadoArrastoFio.ativo = false;
    document.removeEventListener('pointermove', mover);
    document.removeEventListener('pointerup', parar);

    if (endArrastado && moveu){
      const [px, py] = posicaoPontaFio(el, endArrastado);
      const alvo = encontrarAlvoSnap(el, endArrastado, px, py, canvas);
      if (alvo) aplicarSnap(el, endArrastado, alvo);
    }
  }
  document.addEventListener('pointermove', mover);
  document.addEventListener('pointerup', parar);
}

function iniciarArrasto(e){
  if (e.button !== 0) return;
  const el = e.currentTarget;
  const canvas = el.parentElement;
  if (!canvas) return;
  e.preventDefault(); e.stopPropagation();

  let moveu = false;
  const sl = parseFloat(el.style.left) || 0;
  const st = parseFloat(el.style.top) || 0;
  const sx = e.clientX, sy = e.clientY;
  el.classList.add('a-arrastar');
  function mover(ev){
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (Math.hypot(dx, dy) > 4) moveu = true;
    el.style.left = Math.max(0, Math.min(canvas.clientWidth - el.offsetWidth, sl + dx)) + 'px';
    el.style.top  = Math.max(0, Math.min(canvas.clientHeight - el.offsetHeight, st + dy)) + 'px';
    atualizarLigacoesDe(el);
  }
  function parar(){
    if (!moveu) selecionar(el);
    el.classList.remove('a-arrastar');
    document.removeEventListener('pointermove', mover);
    document.removeEventListener('pointerup', parar);
  }
  document.addEventListener('pointermove', mover);
  document.addEventListener('pointerup', parar);
}

function desativarSimboloAtivo(){
  if (!canvasAtual || !canvasAtual.isConnected) return;
  document.querySelectorAll('.paleta-item.ativo').forEach(b => b.classList.remove('ativo'));
  canvasAtual.classList.remove('a-colocar');
}

/* ---------- SIMULAÇÃO ---------- */
let obsCircuito = null, selecionado = null, simPend = false;
const LIM = 14;
const PF = { rot:'Resistência', un:'Ω', min:1, max:1000, def:100, passo:1 };
const MOD = {
  pilha:   { f:1, p:{ rot:'Tensão', un:'V', min:.5, max:12,  def:1.5, passo:.1 } },
  bateria: { f:1, p:{ rot:'Tensão', un:'V', min:1,  max:48,  def:12,  passo:1 } },
  tomada:  { f:1, ac:1, p:{ rot:'Tensão', un:'V', min:100, max:250, def:230, passo:5 } },
  gerador: { f:1, p:{ rot:'Tensão', un:'V', min:1,  max:48,  def:12,  passo:1 } },
  resistencia:          { p:PF, Pn:2, fx:'calor' },
  resistencia_variavel: { p:PF, Pn:2, fx:'calor' },
  lampada:     { R:48,  Pn:3,   fx:'luz',    queima:2 },
  motor:       { R:20,  Pn:5,   fx:'motor' },
  campainha:   { R:60,  Pn:1,   fx:'som' },
  altifalante: { R:8,   Pn:1,   fx:'som' },
  bobine:      { R:10,  Pn:2,   fx:'campo' },
  led:         { R:100, Pn:.04, fx:'led',    queima:5 },
  fusivel:     { R:.01, fusivel:1, p:{ rot:'Corrente máxima', un:'A', min:.1, max:5, def:1, passo:.1 } },
  interruptor_fechado: { R:.01, sw:1 },
  interruptor_aberto:  { open:1, sw:1 },
  amperimetro: { R:.01, med:'I' },
  voltimetro:  { R:1e6, med:'V' },
  wattimetro:  { R:.01, med:'I' },
  fio:         { R:.01 }
};
const modelo = el => MOD[el.dataset.tipo];
const valorDe = el => el.dataset.valor !== undefined ? +el.dataset.valor : (modelo(el).p ? modelo(el).p.def : 0);

function fmt(v, u){
  const a = Math.abs(v);
  if (a >= 1000) return +(v/1000).toFixed(2) + ' k' + u;
  if (a >= 1 || a === 0) return +v.toFixed(a >= 100 ? 0 : 2) + ' ' + u;
  if (a >= 1e-3) return +(v*1e3).toFixed(1) + ' m' + u;
  return +(v*1e6).toFixed(0) + ' µ' + u;
}

function montarElemento(el){
  const m = modelo(el);
  el.innerHTML = SIMBOLOS[el.dataset.tipo].svg;
  if (m && m.fx){ const f = document.createElement('div'); f.className = 'fx fx-' + m.fx; el.prepend(f); }
  if (m && (m.f || m.Pn || m.med)){
    const e = document.createElement('div'); e.className = 'etiqueta';
    e.innerHTML = '<span></span><i class="barra"><b></b></i>'; el.appendChild(e);
  }
  const t = document.createElement('div');
  t.className = 'terminais';
  t.innerHTML = '<span class="terminal"></span><span class="terminal"></span>';
  el.appendChild(t);
}

function alternarInterruptor(el){
  const m = modelo(el); if (!m || !m.sw) return;
  el.dataset.tipo = m.open ? 'interruptor_fechado' : 'interruptor_aberto';
  montarElemento(el);
  if (selecionado === el) selecionar(el);
}

function terminais(el){
  if (el.dataset.tipo === 'fio') return [[+el.dataset.x1, +el.dataset.y1], [+el.dataset.x2, +el.dataset.y2]];
  const rad = ((+el.dataset.rot || 0) % 360) * Math.PI / 180;
  const cos = Math.round(Math.cos(rad)), sin = Math.round(Math.sin(rad));
  const cx = (parseFloat(el.style.left) || 0) + 40, cy = (parseFloat(el.style.top) || 0) + 30;
  const y = el.dataset.tipo === 'campainha' ? 12 : 0;
  return [-32, 32].map(dx => [cx + dx * cos - y * sin, cy + dx * sin + y * cos]);
}

function resolver(els){
  const pts = [], lista = [];
  els.forEach(el => {
    const m = modelo(el); if (!m) return;
    const t = terminais(el); lista.push({ el, m, i:pts.length }); pts.push(t[0], t[1]);
  });
  const pai = pts.map((_, i) => i);
  const raiz = i => { while (pai[i] !== i){ pai[i] = pai[pai[i]]; i = pai[i]; } return i; };
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++)
    if (Math.hypot(pts[i][0]-pts[j][0], pts[i][1]-pts[j][1]) <= LIM) pai[raiz(i)] = raiz(j);
  const ids = new Map();
  const nodo = i => { const r = raiz(i); if (!ids.has(r)) ids.set(r, ids.size); return ids.get(r); };
  lista.forEach(b => {
    b.a = nodo(b.i); b.b = nodo(b.i + 1);
    const m = b.m, el = b.el;
    b.Vs = m.f ? valorDe(el) : 0;
    if (el.dataset.queimado || m.open) b.g = 0;
    else b.g = 1 / (m.f ? .05 : (m.R !== undefined ? m.R : valorDe(el)));
  });
  const N = ids.size;
  const A = Array.from({ length:N }, () => new Array(N + 1).fill(0));
  for (let i = 0; i < N; i++) A[i][i] = 1e-9;
  lista.forEach(b => {
    if (!b.g || b.a === b.b) return;
    A[b.a][b.a] += b.g; A[b.b][b.b] += b.g; A[b.a][b.b] -= b.g; A[b.b][b.a] -= b.g;
    if (b.m.f){ const I = b.Vs * b.g; A[b.a][N] += I; A[b.b][N] -= I; }
  });
  for (let c = 0; c < N; c++){
    let p = c; for (let r = c + 1; r < N; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    const d = A[c][c]; if (Math.abs(d) < 1e-18) continue;
    for (let r = 0; r < N; r++){
      if (r === c) continue;
      const f = A[r][c] / d; if (!f) continue;
      for (let k = c; k <= N; k++) A[r][k] -= f * A[c][k];
    }
  }
  const V = A.map((row, i) => row[N] / row[i]);
  lista.forEach(b => {
    b.V = b.a === b.b ? 0 : V[b.a] - V[b.b];
    b.I = !b.g ? 0 : (b.m.f ? b.Vs * b.g - b.g * b.V : b.g * b.V);
  });
  return lista;
}

function queima(b){
  const m = b.m;
  if (m.fusivel) return Math.abs(b.I) > valorDe(b.el);
  if (m.queima) return Math.abs(b.V * b.I) > m.queima * m.Pn;
  return false;
}

function agendarSim(){
  if (simPend) return; simPend = true;
  requestAnimationFrame(() => { simPend = false; simular(); });
}

function simular(){
  const canvas = canvasAtual; if (!canvas || !canvas.isConnected) return;
  const els = [...canvas.querySelectorAll('.elemento')];
  let lista;
  for (let k = 0; k < 6; k++){
    lista = resolver(els);
    let q = false;
    lista.forEach(b => { if (b.g && !b.el.dataset.queimado && queima(b)){ b.el.dataset.queimado = '1'; q = true; } });
    if (!q) break;
  }
  let fontes = 0, ativas = 0, curto = false, ac = false, total = 0;
  lista.forEach(b => {
    const el = b.el, m = b.m, I = Math.abs(b.I), V = Math.abs(b.V), P = V * I;
    const queimado = !!el.dataset.queimado;
    const lig = I > 1e-4 && m.med !== 'V';
    let n = 0;
    if (m.Pn) n = Math.min(1, P / m.Pn);
    if (m.f){ fontes++; if (I > 1e-4){ ativas++; total += I; if (m.ac) ac = true; } if (I > 20) curto = true; }
    el._r = { V:b.V, I:b.I, P };
    el.classList.toggle('ligado', lig && !queimado);
    el.classList.toggle('queimado', queimado);
    if (el.dataset.tipo === 'fio'){
      el.classList.toggle('inv', b.I < 0);
      el.style.setProperty('--dur', Math.min(1.6, Math.max(.25, 1.6 - Math.log10(I * 1000 + 1) * .4)).toFixed(2) + 's');
      return;
    }
    el.style.setProperty('--n', n.toFixed(3));
    el.style.setProperty('--dur', Math.max(.15, .9 - n * .75).toFixed(2) + 's');
    const et = el.querySelector('.etiqueta');
    if (et){
      let txt = '', barra = 0;
      if (m.f){ txt = fmt(b.Vs, 'V') + (I > 1e-4 ? ' · ' + fmt(I, 'A') : ''); barra = (b.Vs - m.p.min) / (m.p.max - m.p.min); }
      else if (queimado) txt = 'queimado';
      else if (m.med === 'V') txt = fmt(V, 'V');
      else if (m.med === 'I') txt = fmt(I, 'A');
      else { txt = lig ? fmt(V, 'V') + ' · ' + fmt(I, 'A') : '0 V'; barra = lig ? n : 0; }
      et.firstChild.textContent = txt;
      et.querySelector('b').style.width = Math.round(Math.max(0, Math.min(1, barra)) * 100) + '%';
      et.classList.toggle('apagada', !lig && !m.f);
    }
  });
  canvas.classList.toggle('ac', ac);
  const est = document.getElementById('estadoCircuito');
  if (est){
    let t, cl;
    if (!fontes){ t = 'Adiciona uma fonte (pilha, bateria, etc.) e liga-a aos outros elementos.'; cl = ''; }
    else if (curto){ t = '⚠ Curto-circuito! Falta um recetor entre os terminais da fonte.'; cl = 'erro'; }
    else if (!ativas){ t = 'Circuito aberto: faz as pontas dos fios tocarem nos terminais dos símbolos e fecha o circuito.'; cl = 'aviso'; }
    else { t = 'Circuito fechado · corrente fornecida: ' + fmt(total, 'A'); cl = 'ok'; }
    est.textContent = t; est.className = 'estado-circuito ' + cl;
  }
  leituras();
  if (obsCircuito) obsCircuito.takeRecords();
}

function selecionar(el){
  if (selecionado) selecionado.classList.remove('selecionado');
  selecionado = el && el.isConnected && modelo(el) ? el : null;
  const box = document.getElementById('inspetor'); if (!box) return;
  if (!selecionado){
    box.innerHTML = '<p class="insp-dica">Clica num elemento para ajustar o seu valor e ver a energia que recebe. R roda · Ctrl+C / Ctrl+V copia e cola · duplo clique abre ou fecha um interruptor. As pontas dos fios ligam-se automaticamente aos terminais.</p>';
    return;
  }
  selecionado.classList.add('selecionado');
  const m = modelo(selecionado);
  let t = `<strong class="insp-nome">${SIMBOLOS[selecionado.dataset.tipo].nome}</strong>`;
  if (m.p) t += `<label class="insp-ctl"><span>${m.p.rot}: <output id="inspVal"></output></span><input type="range" id="inspRange" min="${m.p.min}" max="${m.p.max}" step="${m.p.passo}"></label>`;
  if (m.sw) t += `<button type="button" class="insp-btn" id="inspSw">${m.open ? 'Fechar interruptor' : 'Abrir interruptor'}</button>`;
  if (selecionado.dataset.tipo === 'fio') t += '<button type="button" class="insp-btn" id="inspReto">Endireitar fio</button><span class="insp-dica">Arrasta o círculo amarelo para curvar o fio. As pontas encaixam nos terminais.</span>';
  t += '<button type="button" class="insp-btn" id="inspRep" hidden>Reparar</button><p class="insp-leituras" id="inspLeituras"></p>';
  box.innerHTML = t;
  const rg = box.querySelector('#inspRange');
  if (rg){
    const out = box.querySelector('#inspVal'), el2 = selecionado;
    rg.value = valorDe(el2); out.textContent = fmt(+rg.value, m.p.un);
    rg.addEventListener('input', () => { el2.dataset.valor = rg.value; out.textContent = fmt(+rg.value, m.p.un); agendarSim(); });
  }
  const reto = box.querySelector('#inspReto');
  if (reto) reto.addEventListener('click', () => { const w = selecionado; delete w.dataset.cx; delete w.dataset.cy; atualizarFio(w); });
  const sw = box.querySelector('#inspSw'); if (sw) sw.addEventListener('click', () => alternarInterruptor(selecionado));
  box.querySelector('#inspRep').addEventListener('click', () => { delete selecionado.dataset.queimado; agendarSim(); });
  leituras();
}

function leituras(){
  const o = document.getElementById('inspLeituras'), rep = document.getElementById('inspRep');
  if (!o || !selecionado || !selecionado.isConnected) return;
  const r = selecionado._r, m = modelo(selecionado), q = !!selecionado.dataset.queimado;
  if (rep) rep.hidden = !q;
  if (!r){ o.textContent = ''; return; }
  if (q) { o.textContent = 'Queimou por excesso de energia. Repara e reduz a tensão ou acrescenta uma resistência.'; return; }
  const I = Math.abs(r.I);
  o.innerHTML = m.f
    ? `Corrente fornecida: <b>${fmt(I, 'A')}</b><br>Potência fornecida: <b>${fmt(Math.abs(r.V * r.I), 'W')}</b>`
    : `Tensão recebida: <b>${fmt(Math.abs(r.V), 'V')}</b><br>Corrente: <b>${fmt(I, 'A')}</b><br>Potência: <b>${fmt(r.P, 'W')}</b>`;
}

/* ---------- ATALHOS ---------- */
let areaTransf = null, contaColar = 0;

function atalhosCircuito(e){
  if (estado.secao !== 'circuitos' || !canvasAtual || !canvasAtual.isConnected) return;
  const t = e.target;
  if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'range'))) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (!mod && !e.altKey && k === 'r'){ e.preventDefault(); if (!e.repeat) rodarSelecionado(); }
  else if (mod && k === 'c' && selecionado && !String(window.getSelection())){ e.preventDefault(); copiarSelecionado(); }
  else if (mod && k === 'v' && areaTransf){ e.preventDefault(); colarElemento(); }
}

function rodarSelecionado(){
  const el = selecionado;
  if (!el || !el.isConnected || el.dataset.tipo === 'fio') return;
  const r = ((+el.dataset.rot || 0) + 90) % 360;
  el.dataset.rot = r;
  el.style.setProperty('--rot', r + 'deg');
  atualizarLigacoesDe(el);
}

function copiarSelecionado(){
  const el = selecionado; if (!el || !el.isConnected) return;
  areaTransf = { ...el.dataset };
  delete areaTransf.queimado;
  areaTransf.left = parseFloat(el.style.left) || 0;
  areaTransf.top  = parseFloat(el.style.top) || 0;
  contaColar = 0;
}

function colarElemento(){
  const canvas = canvasAtual, a = areaTransf;
  if (!canvas || !a) return;
  contaColar++;
  const off = 24 * contaColar;
  desativarSimboloAtivo();
  const dica = canvas.querySelector('.dica-canvas'); if (dica) dica.remove();
  let el;
  if (a.tipo === 'fio'){
    el = criarFio(canvas, 0, 0);
    ['x1', 'y1', 'x2', 'y2', 'cx', 'cy'].forEach(k => { if (a[k] !== undefined) el.dataset[k] = +a[k] + off; });
    atualizarFio(el);
    autoSnapFio(el, canvas);
  } else {
    el = criarElementoNormal(canvas, a.tipo, a.left + 40 + off, a.top + 30 + off);
    el.style.left = Math.max(0, Math.min(canvas.clientWidth  - 80, a.left + off)) + 'px';
    el.style.top  = Math.max(0, Math.min(canvas.clientHeight - 60, a.top  + off)) + 'px';
    if (a.valor !== undefined) el.dataset.valor = a.valor;
    if (a.rot){ el.dataset.rot = a.rot; el.style.setProperty('--rot', a.rot + 'deg'); }
  }
  selecionar(el);
}

function carregarCircuitoPronto(canvas, def){
  canvas.querySelectorAll('.elemento').forEach(e => e.remove());
  const dica = canvas.querySelector('.dica-canvas'); if (dica) dica.remove();
  desativarSimboloAtivo();

  const mapa = {};
  def.itens.forEach(it => {
    const el = criarElementoNormal(canvas, it.tipo, it.x, it.y);
    if (it.valor !== undefined) el.dataset.valor = it.valor;
    if (it.rot){ el.dataset.rot = it.rot; el.style.setProperty('--rot', it.rot + 'deg'); }
    mapa[it.id] = el;
  });

  const ponto = p => typeof p[0] === 'string' ? terminais(mapa[p[0]])[p[1]] : p;
  def.fios.forEach(caminho => {
    for (let i = 0; i < caminho.length - 1; i++){
      const [x1, y1] = ponto(caminho[i]), [x2, y2] = ponto(caminho[i + 1]);
      const f = criarFio(canvas, 0, 0);
      f.dataset.x1 = x1; f.dataset.y1 = y1; f.dataset.x2 = x2; f.dataset.y2 = y2;
      atualizarFio(f);
    }
  });

  canvas.querySelectorAll('.elemento-fio').forEach(f => {
    ['1', '2'].forEach(end => {
      const [x, y] = posicaoPontaFio(f, end);
      const alvo = encontrarAlvoSnap(f, end, x, y, canvas);
      if (alvo) aplicarSnap(f, end, alvo);
    });
  });
  selecionar(null);
  agendarSim();
}

function iniciarProntos(canvas){
  const lista = document.getElementById('prontosLista');
  const desc = document.getElementById('prontosDesc');
  function escolher(id){
    const def = CIRCUITOS_PRONTOS.find(c => c.id === id) || CIRCUITOS_PRONTOS[0];
    estado.pronto = def.id;
    lista.querySelectorAll('.pronto-btn').forEach(b => b.classList.toggle('ativo', b.dataset.id === def.id));
    desc.textContent = def.descricao;
    carregarCircuitoPronto(canvas, def);
  }
  CIRCUITOS_PRONTOS.forEach(def => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pronto-btn';
    b.dataset.id = def.id;
    b.textContent = def.nome;
    b.addEventListener('click', () => escolher(def.id));
    lista.appendChild(b);
  });
  escolher(estado.pronto || CIRCUITOS_PRONTOS[0].id);
}

}
